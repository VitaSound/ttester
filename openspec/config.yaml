schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: ttester — форк тестового фреймворка Hayes/Ertl с расширениями VitaSound (T{ }T, expect-*), часть экосистемы feco.
  Стек: Gforth, правила frules (.cursor/rules), package.4th.
  Проверка: fmix test, flint, fcov run && fcov report; из Cursor — MCP vitasound-forth (fmix_check, fmix_test, flint_lint, fcov_run).
  Потребители: тесты всех библиотек экосистемы — обратная совместимость API обязательна.

rules:
  specs:
    - Scenario формулировать через тестовый фрагмент Forth и ожидаемый вывод/результат фреймворка
  tasks:
    - Каждое требование покрывать тестом в tests/*_test.4th

operations:
  apply:
    guidance:
      - Перед завершением прогонять fmix check; обновлять CHANGELOG.md
